name: Waabi
description: 'Waabi is a Toronto-based artificial intelligence company founded in 2021 by Raquel
  Urtasun, pioneering Physical AI for autonomous driving and starting with self-driving trucks. Its
  flagship product, the Waabi Driver, pairs a generative-AI, end-to-end interpretable and verifiable
  autonomy stack with sensors and compute, trained and validated in Waabi World, a high-fidelity
  neural closed-loop simulator, and designed for factory-level OEM integration and large-scale
  commercialization. Waabi is a product/technology company: as of this enrichment pass it publishes
  no public developer API, SDK, MCP server, or developer portal, so this profile carries identity and
  domain-security signal rather than API artifacts.'
